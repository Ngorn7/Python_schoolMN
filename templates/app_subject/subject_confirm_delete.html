{% extends 'base.html' %}
{% block title %}Delete Subject{% endblock %}
{% block page_title %}Delete Subject{% endblock %}
{% block content %}
<div class="card">
    <div class="card-body">
        <p>Are you sure you want to delete <strong>{{ subject }}</strong>?</p>
        <form method="post">
            {% csrf_token %}
            <button type="submit" class="btn btn-danger">Delete</button>
            <a href="{% url 'subject_list' %}" class="btn btn-secondary">Cancel</a>
        </form>
    </div>
</div>
{% endblock %}
