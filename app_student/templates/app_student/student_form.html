{% extends "base.html" %}
{% block title %}{% if student %}Edit{% else %}Add{% endif %} Student{% endblock %}
{% block page_title %}{% if student %}Edit{% else %}Add{% endif %} Student{% endblock %}
{% block content %}
<div class="card">
  <div class="card-body">
    <form method="post">
      {% csrf_token %}
      <div class="form-group">
        <label>First Name</label>
        <input type="text" name="first_name" class="form-control" value="{{ student.first_name|default:'' }}" required>
      </div>
      <div class="form-group">
        <label>Last Name</label>
        <input type="text" name="last_name" class="form-control" value="{{ student.last_name|default:'' }}" required>
      </div>
      <div class="form-group">
        <label>Gender</label>
        <select name="gender" class="form-control">
          <option value="M" {% if student.gender == 'M' %}selected{% endif %}>Male</option>
          <option value="F" {% if student.gender == 'F' %}selected{% endif %}>Female</option>
        </select>
      </div>
      <div class="form-group">
        <label>Date of Birth</label>
        <input type="date" name="dob" class="form-control" value="{{ student.dob|date:'Y-m-d'|default:'' }}" required>
      </div>
      <div class="form-group">
        <label>Address</label>
        <input type="text" name="address" class="form-control" value="{{ student.address|default:'' }}" required>
      </div>
      <button type="submit" class="btn btn-primary">Save</button>
      <a href="{% url 'app_student:show_category' %}" class="btn btn-secondary">Cancel</a>
    </form>
  </div>
</div>
{% endblock %}
