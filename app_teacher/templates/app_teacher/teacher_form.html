{% extends "base.html" %}
{% block title %}{% if teacher %}Edit{% else %}Add{% endif %} Teacher{% endblock %}
{% block page_title %}{% if teacher %}Edit{% else %}Add{% endif %} Teacher{% endblock %}
{% block content %}
<div class="card">
  <div class="card-body">
    <form method="post">
      {% csrf_token %}
      <div class="form-group">
        <label>First Name</label>
        <input type="text" name="first_name" class="form-control" value="{{ teacher.first_name|default:'' }}" required>
      </div>
      <div class="form-group">
        <label>Last Name</label>
        <input type="text" name="last_name" class="form-control" value="{{ teacher.last_name|default:'' }}" required>
      </div>
      <div class="form-group">
        <label>Gender</label>
        <select name="gender" class="form-control">
          <option value="M" {% if teacher.gender == 'M' %}selected{% endif %}>Male</option>
          <option value="F" {% if teacher.gender == 'F' %}selected{% endif %}>Female</option>
        </select>
      </div>
      <div class="form-group">
        <label>Date of Birth</label>
        <input type="date" name="dob" class="form-control" value="{{ teacher.dob|date:'Y-m-d'|default:'' }}" required>
      </div>
      <div class="form-group">
        <label>Address</label>
        <input type="text" name="address" class="form-control" value="{{ teacher.address|default:'' }}" required>
      </div>
      <div class="form-group">
        <label>Salary</label>
        <input type="number" step="0.01" name="salary" class="form-control" value="{{ teacher.salary|default:'' }}" required>
      </div>
      <button type="submit" class="btn btn-primary">Save</button>
      <a href="{% url 'app_teacher:show_teacher' %}" class="btn btn-secondary">Cancel</a>
    </form>
  </div>
</div>
{% endblock %}
